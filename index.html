<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎲 رمية نرد</title>
  <style>
    body {
      background: #fefefe;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 30px;
    }

    #dice {
      font-size: 100px;
      margin: 20px 0;
      transition: transform 0.3s ease;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    #number {
      font-size: 1.5em;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🎲 ارمي النرد!</h1>

  <div id="dice">🎲</div>
  <div id="number">جاهز للرمي؟</div>
  <button onclick="rollDice()">اضغط للرمي</button>

  <script>
    const diceEl = document.getElementById('dice');
    const numberEl = document.getElementById('number');
    const diceFaces = ['⚀','⚁','⚂','⚃','⚄','⚅'];

    function rollDice() {
      const roll = Math.floor(Math.random() * 6);
      diceEl.textContent = diceFaces[roll];
      numberEl.textContent = `طلعت: ${roll + 1}`;
      diceEl.style.transform = `rotate(${Math.random() * 360}deg)`;
    }
  </script>

</body>
</html>
